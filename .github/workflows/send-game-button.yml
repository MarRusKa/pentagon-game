name: Find Telegram group ID

on:
  workflow_dispatch:

jobs:
  find-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Find group ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" \
          | python3 -c 'import json,sys; d=json.load(sys.stdin); [print("Chat ID:", m["chat"]["id"], "| Title:", m["chat"].get("title", "")) for u in d.get("result", []) for m in [u.get("message", {})] if m.get("chat", {}).get("type") in ("group", "supergroup")]'
